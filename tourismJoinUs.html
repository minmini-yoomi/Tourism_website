<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>JOIN US PAGE</title>
    <style>
        body {
            background-image: url(Images/join-us-bg.png);
            background-repeat: no-repeat;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        h1 {
            text-align: center;
            color: rgb(45, 44, 74);
            margin-bottom: 25px;
        }

        .parent {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-top: 20px;
            margin-bottom: 20px;
            /* background-color: rgba(235, 251, 251, 0.95);
            border: 3px solid rgb(45, 44, 74); */
            background-color: rgba(235, 251, 251, 0.282);
            border: 1px solid rgba(45, 44, 74, 0.325);
            border-radius: 12px;
            padding: 30px 40px;
            width: 80%;
            max-width: 900px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }

        .choices1,
        .choices2 {
            background-color: rgba(219, 252, 252, 0.95);
            padding: 20px;
            width: 250px;
            margin-top: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
        }

        .choicesWrap {
            display: flex;
            flex-wrap: wrap;
            align-content: space-around;
            justify-content: space-between;
            justify-items: center;
        }

        .button {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button {
            background-color: rgba(219, 252, 252, 0.95);
            border: 3px double rgb(45, 44, 74);
            padding: 15px 30px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 20px;
        }

        button:hover {
            background-color: rgb(45, 44, 74);
            color: white;
        }
    </style>
</head>

<body>
    <div class="parent">
        <div class="content">
            <h1 style="font-family:Georgia, 'Times New Roman', Times, serif;">Join us</h1>
            <div class="table">
                <table
                    style="border: 4px dashed rgb(45, 44, 74); padding: 10px; background-color: rgba(219, 252, 252, 0.929); border-radius: 2%;">
                    <form>
                        <tr>
                            <th>First Name: </th>
                            <th><input type="text" name="firstName"></th>
                            <th>Last Name: </th>
                            <th><input type="text" name="lastName"></th>
                        </tr>
                        <tr>
                            <th> <br></th>
                        </tr>
                        <tr>
                            <th>User Name: </th>
                            <th><input type="text" name="username"></th>
                            <th>Date Of Birth:</th>
                            <th><input type="date" name="dob"></th>
                        </tr>
                        <tr>
                            <th> <br></th>
                        </tr>
                        <tr>
                            <th>Gmail: </th>
                            <th><input type="text" name="email"></th>
                            <th>Password: </th>
                            <th><input type="password" name="password"></th>
                        </tr>
                        <tr>
                            <th> <br></th>
                        </tr>
                        <tr>
                            <th>Phone Number:</th>
                            <th><input type="text"></th>
                            <th>City: </th>
                            <th><select style="width: 175px;">
                                    <option value="Damascuse">Damascuse</option>
                                    <option value="aleppo">Aleppo</option>
                                    <option value="latakia">Latakia</option>
                                    <option value="tartous">Tartous</option>
                                    <option value="alswaydaa">Al-Swaydaa</option>
                                    <option value="daraa">Daraa</option>
                                    <option value="homs">Homs</option>
                                    <option value="hama">Hama</option>
                                    <option value="dier-ezzor">Dier-Ezzor</option>
                                    <option value="al-hasakeh">Al-Hasakeh</option>
                                </select></th>
                        </tr>
                    </form>
                </table>
            </div>
            <div class="choicesWrap">
                <div class="choices1">
                    <h3>Gender: </h3>
                    <form>
                        <input type="radio" name="r">
                        <label>Female</label>
                        <input type="radio" name="r">
                        <label>Male</label>
                        <h3>I am a : </h3>
                        <input type="checkbox">
                        <label>Manager</label><br><br>
                        <input type="checkbox">
                        <label>Owner</label><br><br>
                        <input type="checkbox">
                        <label>Tourism Student</label><br><br>
                        <input type="checkbox">
                        <label>Tourism Graduated</label>
                </div>
                <div class="choices2">
                    <h3>I want to :</h3>
                    <input type="checkbox">
                    <label>Launch my activities</label><br><br>
                    <input type="checkbox">
                    <label>Find a job</label><br><br>
                    <input type="checkbox">
                    <label>Train</label>
                    <h3>By Joining us you accept our terms and policy</h3>
                    <input type="checkbox" checked="checked" check disabled style="cursor: not-allowed;">
                    <label>I read terms and I accept</label><br>
                </div>
            </div>

            <div class="button">
                <button id="b1" onclick="x()"><b>JOIN US !</b></button>
            </div>
            </form>
        </div>
    </div>
    </div>
    <script>
        function x() {
            window.alert("WELCOME TO OUR COMUNITY!");
        }
    </script>
</body>

</html>
